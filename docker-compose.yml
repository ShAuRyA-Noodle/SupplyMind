# SupplyMind — one honest service: the FastAPI OpenEnv API.
#
# Removed in P0.2/P0.3 solidification:
#   - `version:` key            — obsolete in Compose v2 (warning noise).
#   - DEMO_MODE / OFFLINE_MODE  — placebo env vars no production code reads,
#                                 and "demo mode" contradicts the everything-live mandate.
#   - `damocles` service        — its container could not start (stale uvicorn module
#                                 path) and 4/5 endpoints were dead on arrival.
#                                 POINTER: the Damocles endpoints (/assess, /forecast,
#                                 /rag, /rl/act) fold into server/app.py in P0.3.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # RL checkpoints/data are excluded from the image (.dockerignore) and
      # mounted read-only at runtime for the /predict RL-agent endpoint.
      - ./rl/checkpoints:/app/rl/checkpoints:ro
      - ./rl/data:/app/rl/data:ro
    healthcheck:
      # python:3.11-slim has no curl; use urllib (matches the Dockerfile HEALTHCHECK).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

name: Deploy to HuggingFace Space

# Manual deployment only. The current GitHub main is intentionally not deployed.
# Uploads repo contents to the Hugging Face Space via the huggingface_hub API.
# Uses upload_folder (not git push) so LFS is handled automatically and any
# historical divergence on the HF side is overwritten cleanly.
#
# REQUIRES: repo secret HF_TOKEN with Write access.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install -U "huggingface_hub>=0.25"

      - name: Verify manual deployment credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN repository secret is missing; no deployment attempted")
          try:
              identity = HfApi(token=token).whoami()
          except Exception as exc:
              raise SystemExit(f"HF_TOKEN was rejected by Hugging Face ({type(exc).__name__}); no deployment attempted") from None
          role = identity.get("auth", {}).get("accessToken", {}).get("role")
          if role == "read":
              raise SystemExit("HF_TOKEN has read-only access; a write-capable token is required")
          print(f"Authenticated to Hugging Face as {identity.get('name')}; checking code before upload")
          PY

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Verify before deployment
        run: |
          uv sync --locked --extra dev
          uv run --locked --extra dev pytest -q --tb=short

      - name: Write deploy script
        run: |
          cat > /tmp/hf_deploy.py <<'PY'
          import os, sys, traceback
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN")
          if not token:
              print("ERROR: HF_TOKEN is empty")
              sys.exit(1)
          try:
              api = HfApi(token=token)
              who = api.whoami()
              print(f"Authenticated as: {who.get('name')}, role: {who.get('auth',{}).get('accessToken',{}).get('role')}", flush=True)
          except Exception as e:
              print(f"AUTH FAIL: {type(e).__name__}: {e}", flush=True)
              traceback.print_exc()
              sys.exit(1)
          try:
              commit = api.upload_folder(
                  folder_path=".",
                  repo_id="Shaurya-Noodle/Supplymind",
                  repo_type="space",
                  commit_message="Deploy v6.0-genesis from GitHub main",
                  ignore_patterns=[
                      ".git/**", ".github/**", "_dump/**", "*.pyc",
                      "__pycache__/**", ".pytest_cache/**", ".tmp_pytest/**",
                      ".source_cache/**", ".openrouter_cache/**", ".agents/**",
                      ".claude/**", ".venv/**", "venv/**", "wandb/**",
                      "catboost_info/**", "notebooks/**", "models/**",
                      "external_data/**", "vendor/**", "rl/checkpoints/**",
                      "rl/analysis/**",
                      "rl/data/*.npz", "rl/data/*.csv",
                      "versions/v3_arcadia/logs/**",
                      "versions/v3_arcadia/checkpoints/**",
                      "versions/v3_arcadia/gguf_out/**",
                      "versions/v3_arcadia/tools/**",
                      "versions/v4_arcadia_live/realtime/events.db*",
                      "versions/v4_arcadia_live/realtime/library_embeddings.pkl",
                      "versions/v4_arcadia_live/autoresearch/experiments/**",
                      "versions/v5_phoenix/.venv-roll/**",
                      "versions/v5_phoenix/.venv/**",
                      "versions/v5_phoenix/experiments/**",
                      "plots/v3/**.npy",
                  ],
              )
              print(f"HF Space upload complete: {commit.oid}", flush=True)
          except Exception as e:
              print(f"UPLOAD FAIL: {type(e).__name__}: {e}", flush=True)
              traceback.print_exc()
              sys.exit(1)
          PY

      - name: Run HF deploy
        id: hf_upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          python /tmp/hf_deploy.py 2>&1 | tee /tmp/hf_deploy.log

      - name: Upload deploy log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf-deploy-log
          path: /tmp/hf_deploy.log
          retention-days: 7

      - name: Smoke test
        if: success()
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 15 https://shaurya-noodle-supplymind.hf.space/health; then
              exit 0
            fi
            sleep 15
          done
          echo "Space health check did not pass after upload"
          exit 1

[project]
name = "supplymind"
version = "1.0.0"
description = "Supply chain risk management OpenEnv environment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "SupplyMind Team"}
]
keywords = ["openenv", "supply-chain", "risk-management", "reinforcement-learning", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "networkx>=3.2",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "openenv-core>=0.2.3",
]

[project.scripts]
server = "server.app:main"

[project.optional-dependencies]
baseline = [
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.25.0",
]
rl = [
    "torch>=2.6.0",  # CVE-2025-32434: torch.load RCE (even weights_only=True) fixed in 2.6.0
    "gymnasium==0.29.1",
    "stable-baselines3==2.2.1",
    "sb3-contrib==2.2.1",
    "d3rlpy==2.3.0",
    "transformers>=4.36.0",
    "scipy>=1.11.0",
    "fredapi>=0.5.0",
    "shap>=0.43.0",
    "mlflow>=2.10.0",
    "wandb>=0.16.0",
]
# NOTE: the `dashboard` extra (streamlit + plotly) was removed — the Streamlit
# `dashboard/` app is deleted (CLAUDE.md §3.1). The one dashboard is the war
# room, served as static files by the `server` app; it needs no extra deps.

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

# Top-level single-file modules. packages.find CANNOT discover these (it only
# finds packages), so pip install . otherwise shipped a dist where
# `from models import ...` and `from baseline import ...` (server/app.py) fail.
# Listing them here also avoids the `models*` glob colliding with the models/
# weights directory.
[tool.setuptools]
py-modules = ["models", "baseline", "client", "scripted_agent", "inference", "llm_agent_common"]

[tool.setuptools.packages.find]
include = ["supplymind*", "server*", "rl*", "benchmark*"]
exclude = ["tests*", "*.tests", "*.tests.*"]
